[package]
name = "ft-fixture"
description = "TEST-ONLY NEP-141 fungible-token fixture for local NEAR Sandbox receipts; not production, not ShowStake escrow"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

# Fields inherited from the official `cargo near new` template (cargo-near
# v0.23.0). They are kept only as scaffold provenance; this local fixture is
# built non-reproducibly for a throwaway sandbox and never deployed publicly.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-contract-standards = "=5.30.1"
near-sdk = "=5.30.1"

[dev-dependencies]
near-contract-standards = "=5.30.1"
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
