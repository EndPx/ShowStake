openapi: 3.0.3
info:
  title: ShowStake /v1 (provisional interface)
  version: 0.1.0-provisional
  description: >
    PROVISIONAL API contract for the ShowStake v2 backend. This is a worker-written
    interface derived from docs/planning/showstake-v2/02-ARCHITECTURE.md ("API
    contract") and 01-PRODUCT.md. It is NOT frozen: Codex freezes the ABI/domain
    after review (D012-D016 + T01 acceptance).

    Authentication provider is REOPENED: NEAR Auth and HOT/NEAR Connect are
    evaluated first (see docs/onboarding-capabilities.md); Privy remains an
    alternative only. No provider is a final choice in this document. Public
    routes are marked `security: []`; everything else requires a session cookie
    (scheme `sessionCookie`). Host-only routes (attendance roster/check-in) are
    named in their `description`; a participant must NOT pass these permissions.

    All money values are canonical unsigned-128 base-10 STRINGS (never floats).
    The OpenAPI `pattern` below is a STRUCTURAL digit-form check only; the
    authoritative 2^128-1 ceiling is enforced semantically by
    `packages/domain` (BigInt parse) and the `atomic_amount` database domain —
    verified in scripts/verify-openapi.mjs.

servers:
  - url: http://localhost:3000/v1
    description: Local disposable environment only.

security:
  - sessionCookie: []

tags:
  - name: events
  - name: auth
  - name: funding
  - name: passes
  - name: checkin
  - name: claims
  - name: content

paths:
  /funding:
    get:
      tags: [funding]
      summary: List the verified wallet's funding journal
      description: >-
        Requires a verified mainnet NEAR session. Returns up to 50 attempts for the immutable
        session wallet binding, newest first. Provider status is observational and does not
        register a participant or grant a pass.
      responses:
        '200':
          description: Funding attempts for this session owner and binding
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [attempts]
                        properties:
                          attempts:
                            type: array
                            maxItems: 50
                            items:
                              $ref: '#/components/schemas/FundingJournalAttempt'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /funding/quotes:
    post:
      tags: [funding]
      summary: Persist a provider-verified live quote
      description: >-
        Requires an allowed Origin and a verified mainnet NEAR session whose account matches
        the recipient. This route does not issue a quote: it checks the submitted quote against
        the provider's current PENDING_DEPOSIT response and stores it. An unresolved attempt
        for the binding blocks a different quote. No funds are transferred by this route.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FundingJournalQuote' }
      responses:
        '200':
          description: Persisted or matching existing quote
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [attempt]
                        properties:
                          attempt: { $ref: '#/components/schemas/FundingJournalAttempt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /funding/{id}/reserve:
    post:
      tags: [funding]
      summary: Reserve one source-wallet submission
      description: >-
        Requires allowed Origin and verified mainnet NEAR owner session. Checks the provider
        quote before an atomic QUOTED to SOURCE_PENDING transition. Only created=true permits
        the client to open its wallet; false must never trigger another wallet submission.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reservation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [created]
                        properties:
                          created: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /funding/{id}/submitted:
    post:
      tags: [funding]
      summary: Record an EVM source transaction hash
      description: >-
        Requires allowed Origin and the verified mainnet NEAR owner session. Binds the hash to
        a SOURCE_PENDING attempt; repeating the same hash is accepted, a different hash is rejected.
        Recording a hash does not prove transaction success.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash]
              properties:
                hash: { type: string, pattern: '^0x[0-9a-fA-F]{64}$' }
      responses:
        '200':
          description: Hash saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [saved]
                        properties:
                          saved: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /funding/{id}/reconcile:
    post:
      tags: [funding]
      summary: Observe provider status for a stored attempt
      description: >-
        Requires allowed Origin and the verified mainnet NEAR owner session. The server checks
        provider quote identity and persists its observed status; the client cannot supply a
        status. An unknown or unavailable result fails closed. SUCCESS means provider-reported
        funding only; participant-signed NEAR registration remains separate.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Provider status observation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { $ref: '#/components/schemas/FundingProviderStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /rhea/microtest:
    get:
      tags:
        - funding
      summary: Read approved treasury journal without signing authority
      description: >-
        Mainnet dedicated treasury only. Requires an operator-installed, scoped approval file and matching
        verified session. POST requires an allowed Origin. No server signing or broadcast. Existing/unknown
        operations must be reconciled, never blindly retried.
      responses:
        '200':
          description: Journal observation or exact unsigned operation; success does not imply a completed withdrawal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - approvalId
                          - planHash
                          - treasury
                          - operations
                          - signingAuthority
                        properties:
                          approvalId:
                            type: string
                            format: uuid
                          planHash:
                            type: string
                          treasury:
                            type: string
                          provider:
                            type: string
                          asset:
                            type: string
                          maxUsdcAtomic:
                            $ref: '#/components/schemas/Money'
                          maxNativeYocto:
                            $ref: '#/components/schemas/Money'
                          gasPriceCeiling:
                            $ref: '#/components/schemas/Money'
                          expiresAt:
                            type: string
                            format: date-time
                          nativeReservedAtomic:
                            $ref: '#/components/schemas/Money'
                          usdcReservedAtomic:
                            $ref: '#/components/schemas/Money'
                          operations:
                            type: array
                            items:
                              type: object
                              required:
                                - operationId
                                - step
                                - status
                                - receiverId
                                - methodName
                                - args
                                - gas
                                - depositYocto
                                - beforeBlockHash
                              properties:
                                operationId:
                                  type: string
                                  format: uuid
                                step:
                                  type: string
                                  enum:
                                    - ft_storage
                                    - provider_storage
                                    - supply
                                    - partial
                                    - full
                                status:
                                  type: string
                                  enum:
                                    - RESERVED
                                    - SUBMITTED
                                    - CONFIRMED
                                    - SKIPPED
                                    - QUARANTINED
                                hash:
                                  type: string
                                  nullable: true
                                receiverId:
                                  type: string
                                methodName:
                                  type: string
                                args:
                                  type: object
                                  additionalProperties: true
                                gas:
                                  $ref: '#/components/schemas/Money'
                                depositYocto:
                                  $ref: '#/components/schemas/Money'
                                maxNativeAtomic:
                                  $ref: '#/components/schemas/Money'
                                beforeBlockHash:
                                  type: string
                          signingAuthority:
                            type: boolean
                            enum:
                              - false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /rhea/microtest/reserve:
    post:
      tags:
        - funding
      summary: Treasury microtest reserve
      description: >-
        Mainnet dedicated treasury only. Requires an operator-installed, scoped approval file and matching
        verified session. POST requires an allowed Origin. No server signing or broadcast. Existing/unknown
        operations must be reconciled, never blindly retried.
      responses:
        '200':
          description: Journal observation or exact unsigned operation; success does not imply a completed withdrawal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          created:
                            type: boolean
                            description: Only true on a first reservation; false never authorizes another wallet request
                          operation:
                            type: object
                            required:
                              - operationId
                              - step
                              - status
                              - receiverId
                              - methodName
                              - args
                              - gas
                              - depositYocto
                              - beforeBlockHash
                            properties:
                              operationId:
                                type: string
                                format: uuid
                              step:
                                type: string
                                enum:
                                  - ft_storage
                                  - provider_storage
                                  - supply
                                  - partial
                                  - full
                              status:
                                type: string
                                enum:
                                  - RESERVED
                                  - SUBMITTED
                                  - CONFIRMED
                                  - SKIPPED
                                  - QUARANTINED
                              hash:
                                type: string
                                nullable: true
                              receiverId:
                                type: string
                              methodName:
                                type: string
                              args:
                                type: object
                                additionalProperties: true
                              gas:
                                $ref: '#/components/schemas/Money'
                              depositYocto:
                                $ref: '#/components/schemas/Money'
                              maxNativeAtomic:
                                $ref: '#/components/schemas/Money'
                              beforeBlockHash:
                                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - step
              properties:
                step:
                  type: string
                  enum:
                    - ft_storage
                    - provider_storage
                    - supply
                    - partial
                    - full
  /rhea/microtest/submitted:
    post:
      tags:
        - funding
      summary: Treasury microtest submitted
      description: >-
        Mainnet dedicated treasury only. Requires an operator-installed, scoped approval file and matching
        verified session. POST requires an allowed Origin. No server signing or broadcast. Existing/unknown
        operations must be reconciled, never blindly retried.
      responses:
        '200':
          description: Journal observation or exact unsigned operation; success does not imply a completed withdrawal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          created:
                            type: boolean
                            description: Only true on a first reservation; false never authorizes another wallet request
                          operation:
                            type: object
                            required:
                              - operationId
                              - step
                              - status
                              - receiverId
                              - methodName
                              - args
                              - gas
                              - depositYocto
                              - beforeBlockHash
                            properties:
                              operationId:
                                type: string
                                format: uuid
                              step:
                                type: string
                                enum:
                                  - ft_storage
                                  - provider_storage
                                  - supply
                                  - partial
                                  - full
                              status:
                                type: string
                                enum:
                                  - RESERVED
                                  - SUBMITTED
                                  - CONFIRMED
                                  - SKIPPED
                                  - QUARANTINED
                              hash:
                                type: string
                                nullable: true
                              receiverId:
                                type: string
                              methodName:
                                type: string
                              args:
                                type: object
                                additionalProperties: true
                              gas:
                                $ref: '#/components/schemas/Money'
                              depositYocto:
                                $ref: '#/components/schemas/Money'
                              maxNativeAtomic:
                                $ref: '#/components/schemas/Money'
                              beforeBlockHash:
                                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operationId
                - hash
              properties:
                operationId:
                  type: string
                  format: uuid
                hash:
                  type: string
  /rhea/microtest/reconcile:
    post:
      tags:
        - funding
      summary: Treasury microtest reconcile
      description: >-
        Mainnet dedicated treasury only. Requires an operator-installed, scoped approval file and matching
        verified session. POST requires an allowed Origin. No server signing or broadcast. Existing/unknown
        operations must be reconciled, never blindly retried.
      responses:
        '200':
          description: Journal observation or exact unsigned operation; success does not imply a completed withdrawal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          created:
                            type: boolean
                            description: Only true on a first reservation; false never authorizes another wallet request
                          operation:
                            type: object
                            required:
                              - operationId
                              - step
                              - status
                              - receiverId
                              - methodName
                              - args
                              - gas
                              - depositYocto
                              - beforeBlockHash
                            properties:
                              operationId:
                                type: string
                                format: uuid
                              step:
                                type: string
                                enum:
                                  - ft_storage
                                  - provider_storage
                                  - supply
                                  - partial
                                  - full
                              status:
                                type: string
                                enum:
                                  - RESERVED
                                  - SUBMITTED
                                  - CONFIRMED
                                  - SKIPPED
                                  - QUARANTINED
                              hash:
                                type: string
                                nullable: true
                              receiverId:
                                type: string
                              methodName:
                                type: string
                              args:
                                type: object
                                additionalProperties: true
                              gas:
                                $ref: '#/components/schemas/Money'
                              depositYocto:
                                $ref: '#/components/schemas/Money'
                              maxNativeAtomic:
                                $ref: '#/components/schemas/Money'
                              beforeBlockHash:
                                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operationId
                - hash
              properties:
                operationId:
                  type: string
                  format: uuid
                hash:
                  type: string
  /mainnet/readiness:
    get:
      summary: Read finalized mainnet readiness without signing authority
      tags:
        - events
      security: []
      responses:
        '200':
          description: Observational paused deployment; provider remains unverified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - contractId
                          - codeHash
                          - paused
                          - principalCapAtomic
                          - eventPresent
                          - providerStatus
                          - signingAuthority
                        properties:
                          contractId:
                            type: string
                          codeHash:
                            type: string
                          paused:
                            type: boolean
                          principalCapAtomic:
                            $ref: '#/components/schemas/Money'
                          eventPresent:
                            type: boolean
                          providerStatus:
                            type: string
                            enum:
                              - UNVERIFIED
                          signingAuthority:
                            type: boolean
                            enum:
                              - false
        '503':
          $ref: '#/components/responses/Unavailable'

  /events:
    get:
      summary: List published events (public)
      tags: [events]
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated event list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventListEnvelope' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /events/{eventId}:
    get:
      summary: Event detail + finalized rules/counts (public)
      tags:
        - events
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: contractId
          in: query
          required: false
          schema:
            type: string
          description: When supplied, eventId is a chain event id scoped by this contract and server network.
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/drafts:
    post:
      summary: Create an offchain event draft (organizer-capable session)
      tags: [events]
      description: >
        ORGANIZER-CAPABLE: requires an authenticated organizer/host role. The
        draft's economic rules/times are immutable once published; a participant
        must NOT pass this permission (403).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftRequest' }
      responses:
        '200':
          description: Created draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /events/{eventId}/publish-intent:
    post:
      summary: Return a validated publish contract-call proposal (draft owner + NEAR binding)
      tags: [events]
      description: >
        DRAFT OWNER + NEAR binding: returns a validated contract-call proposal for
        the organizer wallet to sign; the server never signs organizer financial
        actions and the contract revalidates the call. Requires the draft owner's
        session and a machine-verified NEAR binding (403 otherwise).
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishIntentRequest' }
      responses:
        '200':
          description: Validated publish intent (contract call payload to sign)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishIntentEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/challenge:
    post:
      summary: Create a login challenge (public; no session)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeRequest' }
      responses:
        '200':
          description: Challenge to sign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeEnvelope' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/verify:
    post:
      summary: Consume a challenge proof and open a session
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      summary: Revoke the current session and clear its cookie
      tags: [auth]
      description: Requires a current session and an allowed Origin or Referer; no participant pass required.
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me:
    get:
      summary: Read the current authenticated session
      tags: [auth]
      responses:
        '200':
          description: Current session identity; no participant pass required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/privy:
    post:
      summary: Resolve app identity from a verified Privy JWT (candidate adapter route)
      tags: [auth]
      security: []
      description: >
        CANDIDATE ADAPTER ROUTE preserving the baseline /auth/privy entry. A
        server-verified Privy JWT (issuer/audience/expiry validated server-side)
        resolves the app identity; it does NOT by itself grant NEAR participant
        actions — those require a machine-verified NEAR account binding. The
        provider is REOPENED: NEAR Auth and HOT/NEAR Connect are evaluated first
        (see docs/onboarding-capabilities.md); Privy remains an alternative only.
        Rate-limits apply as for /auth/challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivyAuthRequest' }
      responses:
        '200':
          description: Resolved identity + whether a NEAR binding is present
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivyAuthEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me/identities/link:
    post:
      summary: Link a new login identity (fresh session + proof)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkIdentityRequest' }
      responses:
        '200':
          description: Link result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/wallets/link:
    post:
      summary: Link a controlled NEAR account (proof required)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkWalletRequest' }
      responses:
        '200':
          description: Wallet binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletBindingEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/passes:
    get:
      summary: Current verified pass projection
      description: The account is taken from the verified session wallet binding; no client account selector is accepted. Projection data is observational and may be marked stale.
      tags: [passes]
      responses:
        '200':
          description: Pass list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassListEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /passes/{passId}/qr:
    post:
      summary: Issue a 60s check-in QR challenge (owner only)
      tags: [passes]
      parameters:
        - $ref: '#/components/parameters/PassId'
      responses:
        '200':
          description: QR challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QrEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /funding/attempts:
    post:
      summary: Create an immutable funding attempt (idempotent)
      description: Provisional planning route; not implemented by the current API.
      tags: [funding]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FundingAttemptRequest' }
      responses:
        '200':
          description: Attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FundingAttemptEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /funding/{attemptId}/quote:
    post:
      summary: Return a validated quote (no spend)
      description: Provisional planning route; not implemented by the current API.
      tags: [funding]
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /funding/{attemptId}:
    get:
      summary: Funding attempt state + next required action
      description: Provisional planning route; not implemented by the current API.
      tags: [funding]
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FundingAttemptEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventId}/checkin-requests:
    post:
      summary: Validate QR / manual request and return a call proposal (host only)
      tags: [checkin]
      description: >
        HOST-ONLY: requires the organizer/host role for this event. A participant
        must NOT pass this permission (403).
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckinRequestRequest' }
      responses:
        '200':
          description: Check-in request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinRequestEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /events/{eventId}/attendance:
    get:
      summary: Organizer roster (host only)
      tags: [checkin]
      description: >
        HOST-ONLY: roster of attendance. A participant must NOT pass this
        permission (403); the response never exposes a host view to a participant.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Roster
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosterEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventId}/results:
    get:
      summary: Public results + personal claim detail (public)
      tags:
        - claims
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: contractId
          in: query
          required: false
          schema:
            type: string
          description: When supplied, eventId is a chain event id scoped by this contract and server network.
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/claims:
    get:
      summary: Immutable beneficiary credits
      description: Claims are keyed by the immutable beneficiary account from the verified session wallet binding and remain read-only projections of finalized contract state.
      tags: [claims]
      responses:
        '200':
          description: Claims
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimListEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events/{eventId}/content:
    post:
      summary: Publish private material as finalized onchain organizer
      description: >-
        Host only. Verified session, matching Origin and fresh final organizer authority required; attendee reads
        remain attendance and settlement gated.
      tags:
        - content
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - title
                - mimeType
                - contentBase64
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 256
                mimeType:
                  type: string
                  enum:
                    - application/pdf
                    - text/plain
                    - image/png
                    - image/jpeg
                contentBase64:
                  type: string
                  maxLength: 699052
                  description: Canonical base64; decoded payload at most 512 KiB
      responses:
        '201':
          description: Published private descriptor with opaque ID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - id
                          - title
                          - mimeType
                          - bytesSize
                          - publishedAt
                        properties:
                          id:
                            type: string
                            pattern: ^[a-f0-9]{64}$
                          title:
                            type: string
                          mimeType:
                            type: string
                          bytesSize:
                            type: integer
                            minimum: 0
                            maximum: 524288
                          publishedAt:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      summary: List private materials for an attended and settled pass
      description: Requires fresh finalized onchain ownership and attendance. Returns opaque resource identifiers; downloads recheck authorization and never expose object storage paths or public fallback URLs.
      tags: [content]
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Private resource identifiers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'

  /events/{eventId}/checkin/challenge:
    post:
      summary: Issue an owner-bound check-in token valid for 60 seconds
      tags: [checkin]
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [passId], properties: { passId: { type: string, format: uuid } } }
      responses:
        '200':
          description: Opaque signed token and expiry; no attendance is changed
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, required: [token, expiresAt], properties: { token: { type: string }, expiresAt: { type: string, format: date-time } } } } } ] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /events/{eventId}/checkin/scan:
    post:
      summary: Consume a check-in token and create an organizer proposal
      description: HOST-ONLY. Requires the finalized onchain organizer. Atomically consumes the token once and creates PROPOSED; the organizer must separately sign mark_attendance.
      tags: [checkin]
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string, maxLength: 4096 } } }
      responses:
        '200':
          description: Pending check-in proposal only
          content:
            application/json:
              schema: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, required: [requestId, passId, ownerAccount, state], properties: { requestId: { type: string, format: uuid }, passId: { type: string, format: uuid }, ownerAccount: { type: string }, state: { type: string, enum: [PROPOSED] } } } } } ] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /events/{eventId}/content/{resourceId}:
    get:
      summary: Download a private file after fresh onchain authorization
      tags: [content]
      parameters:
        - $ref: '#/components/parameters/EventId'
        - { name: resourceId, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      responses:
        '200':
          description: Private attachment; no-store and authorization on every request
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }


  /direct/events/{eventId}/qr:
    post:
      summary: Issue a final-chain verified check-in token
      description: Requires a session-bound owner, active unmarked onchain pass, and the registration-closed check-in window. The token expires in at most 60 seconds. The direct profile and deployment must be explicitly pinned.
      tags: [checkin]
      parameters:
        - $ref: '#/components/parameters/DirectEventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractId, passId]
              properties:
                contractId: { type: string, minLength: 1, maxLength: 128 }
                passId: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Signed owner-bound token; attendance is unchanged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DirectEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [token, expiresAt]
                        properties:
                          token: { type: string }
                          expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /direct/events/{eventId}/checkin:
    post:
      summary: Create a one-use onchain check-in proposal
      description: HOST-ONLY. Requires the current onchain organizer and rechecks the pass against a fresh finalized block. PENDING_SIGNATURE is a proposal; it does not mark attendance or spend funds.
      tags: [checkin]
      parameters:
        - $ref: '#/components/parameters/DirectEventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractId, token]
              properties:
                contractId: { type: string, minLength: 1, maxLength: 128 }
                token: { type: string, maxLength: 4096 }
      responses:
        '200':
          description: Pending organizer signature
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DirectEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [requestId, passId, registrationId, ownerAccount, state]
                        properties:
                          requestId: { type: string, format: uuid }
                          passId: { type: string }
                          registrationId: { type: string }
                          ownerAccount: { type: string }
                          state: { type: string, enum: [PENDING_SIGNATURE] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /direct/events/{eventId}/content:
    post:
      summary: Upload private content as the onchain organizer
      description: HOST-ONLY. Uses a fresh final-chain organizer check. The decoded file is at most 512 KiB and is never exposed through a public URL.
      tags: [content]
      parameters:
        - $ref: '#/components/parameters/DirectEventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractId, title, mimeType, contentBase64]
              properties:
                contractId: { type: string, minLength: 1, maxLength: 128 }
                title: { type: string, minLength: 1, description: Maximum 256 UTF-8 bytes. }
                mimeType: { type: string, enum: [application/pdf, text/plain, image/png, image/jpeg] }
                contentBase64: { type: string, maxLength: 699052, description: Canonical base64; decoded size at most 524288 bytes. }
      responses:
        '201':
          description: Private resource metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DirectEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DirectResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      summary: List resources for a settled attended onchain pass
      description: Requires a session-bound owner, Attended pass, and final-chain Settled and Redeemed event. Opaque resource IDs are not public URLs.
      tags: [content]
      parameters:
        - $ref: '#/components/parameters/DirectEventId'
        - $ref: '#/components/parameters/DirectContractId'
        - $ref: '#/components/parameters/DirectPassId'
      responses:
        '200':
          description: Private resource metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DirectEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/DirectListedResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /direct/events/{eventId}/content/{resourceId}:
    get:
      summary: Download a private resource with fresh final-chain authorization
      description: Session cookie and the same attended settled-pass check are required for every download. The response is a private attachment with no-store and FINAL_CHAIN source and authority headers.
      tags: [content]
      parameters:
        - $ref: '#/components/parameters/DirectEventId'
        - $ref: '#/components/parameters/DirectContractId'
        - $ref: '#/components/parameters/DirectPassId'
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Private attachment
          headers:
            X-ShowStake-Source: { schema: { type: string, enum: [FINAL_CHAIN] } }
            X-ShowStake-Authority: { schema: { type: string, enum: [FINAL_CHAIN] } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: showstake_session
      description: HttpOnly Secure SameSite session cookie whose token hash is stored server-side.

  parameters:
    DirectEventId:
      name: eventId
      in: path
      required: true
      description: Contract event ID, not a database UUID.
      schema: { type: string, minLength: 1, maxLength: 128 }
    DirectContractId:
      name: contractId
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    DirectPassId:
      name: passId
      in: query
      required: true
      description: Contract pass ID, not a database UUID.
      schema: { type: string, minLength: 1, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 'Page size, default 50, max 100.'
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PassId:
      name: passId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Required on funding attempt and check-in request creation. Same key + different body => 409.'
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but lacking the required role (e.g. host-only route)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Idempotency conflict or state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Request body/parameters failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: Authoritative projection or private-resource signer unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    DirectEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            meta:
              type: object
              required: [requestId, observedAt, network, stale, source, authority]
              description: stale describes only final-chain authorization; it does not report indexer coverage.
              properties:
                requestId: { type: string }
                observedAt: { type: string, format: date-time }
                network: { type: string, enum: [testnet, mainnet] }
                stale: { type: boolean, enum: [false] }
                source: { type: string, enum: [FINAL_CHAIN] }
                authority: { type: string, enum: [FINAL_CHAIN] }
    DirectListedResource:
      type: object
      required: [id, title, mimeType, publishedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        mimeType: { type: string }
        publishedAt: { type: string, format: date-time }
    DirectResource:
      allOf:
        - $ref: '#/components/schemas/DirectListedResource'
        - type: object
          required: [bytesSize]
          properties:
            bytesSize: { type: integer, minimum: 1, maximum: 524288 }
    FundingProviderStatus:
      type: string
      enum: [PENDING_DEPOSIT, KNOWN_DEPOSIT_TX, PROCESSING, SUCCESS, REFUNDED, FAILED, INCOMPLETE_DEPOSIT]
    FundingJournalQuote:
      type: object
      description: >-
        A live 1Click quote bound to the session recipient, source ETH asset and EVM refund
        address. Atomics are positive canonical u128 strings; source ETH uses 18 decimals,
        destination native NEAR USDC uses 6. Server rechecks provider identity and status.
      required: [dry, originAsset, destinationAsset, recipient, refundTo, amountIn, amountOut, minAmountOut, deadline, observedAt, depositAddress, correlationId, chainId, slippageTolerance]
      properties:
        dry: { type: boolean, enum: [false] }
        originAsset: { type: string, enum: ['nep141:base.omft.near', 'nep141:eth.omft.near'] }
        destinationAsset: { type: string, enum: ['nep141:17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1'] }
        recipient: { type: string, description: Must equal the verified NEAR session account }
        refundTo: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        amountIn: { allOf: [{ $ref: '#/components/schemas/Money' }], pattern: '^[1-9][0-9]*$' }
        amountOut: { allOf: [{ $ref: '#/components/schemas/Money' }], pattern: '^[1-9][0-9]*$' }
        minAmountOut: { allOf: [{ $ref: '#/components/schemas/Money' }], pattern: '^[1-9][0-9]*$' }
        deadline: { type: string, format: date-time }
        observedAt: { type: string, format: date-time }
        depositAddress: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        correlationId: { type: string, minLength: 1, maxLength: 200 }
        chainId: { type: string, enum: ['0x2105', '0x1'], description: Must match originAsset }
        slippageTolerance: { type: integer, enum: [50], description: Basis points }
    FundingJournalAttempt:
      type: object
      required: [id, state, sourceTxHash, providerStatus, providerStatusObservedAt, quote]
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          enum: [CREATED, QUOTED, SOURCE_PENDING, SWAP_SETTLED, READY_TO_COMMIT, COMMIT_PENDING, COMMITTED, EXPIRED, FAILED, PROVIDER_REFUNDED, ACTION_REQUIRED, UNKNOWN]
          description: Stored journal state; it is not registration authority.
        sourceTxHash: { type: string, nullable: true, pattern: '^0x[0-9a-fA-F]{64}$' }
        providerStatus:
          allOf: [{ $ref: '#/components/schemas/FundingProviderStatus' }]
          nullable: true
        providerStatusObservedAt: { type: string, format: date-time, nullable: true }
        quote: { $ref: '#/components/schemas/FundingJournalQuote' }
    Money:
      type: string
      description: >
        Canonical unsigned-128 integer as a base-10 string; never a float. This
        OpenAPI `pattern` is a STRUCTURAL digit-form check only (no leading zeros,
        no sign, no fraction). The authoritative 2^128-1 ceiling is enforced
        semantically by packages/domain (BigInt) and the atomic_amount DB domain;
        scripts/verify-openapi.mjs proves the ceiling. Structures carrying money
        therefore also pass the semantic u128 validator, not merely the regex.
      pattern: '^(0|[1-9][0-9]*)$'
      example: '5000000'

    Meta:
      type: object
      required: [requestId, observedAt]
      properties:
        requestId:
          type: string
        observedAt:
          type: string
          format: date-time
        network:
          type: string
          enum: [local, testnet, mainnet]
          nullable: true
        stale:
          type: boolean
          description: true when the projection source is stale; money actions are disabled.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean

    BaseEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Error'

    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data:
              nullable: true

    EventState:
      type: string
      enum: [PUBLISHED, ATTENDANCE_FINALIZED, SETTLING, SETTLED, CANCELLED, REFUND_ONLY]
    FundingState:
      type: string
      enum: [CREATED, QUOTED, SOURCE_PENDING, SWAP_SETTLED, READY_TO_COMMIT, COMMIT_PENDING, COMMITTED, EXPIRED, FAILED, PROVIDER_REFUNDED, ACTION_REQUIRED, UNKNOWN]
    RegistrationState:
      type: string
      enum: [COMMITTED, WITHDRAWN, ATTENDED, NO_SHOW, REFUNDABLE]
    PayoutState:
      type: string
      enum: [NOT_CLAIMABLE, CLAIMABLE, PENDING, PAID, ZERO]

    Event:
      type: object
      required: [id, chainEventId, network, contractId, state, depositAtomic, capacity, times]
      properties:
        id: { type: string, format: uuid }
        chainEventId: { type: string, description: 'Event identifier inside contractId; distinct from database UUID id' }
        title: { type: string, nullable: true }
        location: { type: string, nullable: true }
        rulesText: { type: string, nullable: true }
        network: { type: string }
        contractId: { type: string }
        state: { $ref: '#/components/schemas/EventState' }
        depositAtomic: { $ref: '#/components/schemas/Money' }
        capacity: { type: integer }
        times:
          type: object
          properties:
            regOpen: { type: string, format: date-time }
            regClose: { type: string, format: date-time }
            cancelCutoff: { type: string, format: date-time }
            checkinOpen: { type: string, format: date-time }
            checkinClose: { type: string, format: date-time }
            finalizeDeadline: { type: string, format: date-time }
        totals:
          type: object
          required: [acceptedAtomic, paidAtomic, pendingAtomic, liabilityAtomic, realizedYieldAtomic, allocatedYieldAtomic, unallocatedYieldAtomic]
          properties:
            acceptedAtomic: { $ref: '#/components/schemas/Money' }
            realizedYieldAtomic: { $ref: '#/components/schemas/Money' }
            allocatedYieldAtomic: { $ref: '#/components/schemas/Money' }
            unallocatedYieldAtomic: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Held yield not allocated to participant claims' }
            paidAtomic: { $ref: '#/components/schemas/Money' }
            pendingAtomic: { $ref: '#/components/schemas/Money' }
            liabilityAtomic: { $ref: '#/components/schemas/Money' }
        registeredCount: { type: integer, nullable: true }
        observedAt: { type: string, format: date-time }

    Pass:
      type: object
      required:
        - id
        - eventId
        - ownerAccount
        - network
        - contractId
        - chainEventId
        - chainRegistrationId
        - chainPassId
      properties:
        id:
          type: string
        eventId:
          type: string
          format: uuid
        ownerAccount:
          type: string
        registrationStatus:
          $ref: '#/components/schemas/RegistrationState'
        attendanceStatus:
          type: boolean
        financialStatus:
          $ref: '#/components/schemas/PayoutState'
        finalized:
          type: boolean
          description: true when this row came from a finalized chain receipt; false/absent must disable money actions.
        network:
          type: string
        contractId:
          type: string
        chainEventId:
          type: string
        chainRegistrationId:
          type: string
          nullable: true
        chainPassId:
          type: string
          nullable: true
    FundingAttempt:
      type: object
      required: [id, state, participantAccount, expectedAtomic]
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/FundingState' }
        participantAccount: { type: string }
        expectedAtomic: { $ref: '#/components/schemas/Money' }

    # ---- request bodies -----------------------------------------------------
    ChallengeRequest:
      type: object
      required: [accountId, network, domain]
      properties:
        accountId: { type: string }
        network: { type: string, enum: [local, testnet, mainnet] }
        domain: { type: string }
    VerifyRequest:
      type: object
      required: [challengeId, accountId, network, domain, nonce, signature, publicKey]
      properties:
        challengeId: { type: string, format: uuid }
        accountId: { type: string }
        network: { type: string, enum: [local, testnet, mainnet] }
        domain: { type: string }
        nonce: { type: string, pattern: '^[0-9a-fA-F]{64}$', description: 'Echo of the issued 32-byte nonce in hex' }
        signature: { type: string, description: 'base64 signature over the challenge payload' }
        publicKey: { type: string, description: 'NEAR ed25519 public key in ed25519:base58 form' }
    LinkIdentityRequest:
      type: object
      required: [provider, subject, proof]
      properties:
        provider: { type: string }
        subject: { type: string }
        proof: { type: string, description: 'provider-verifiable proof of the claimed subject' }
    LinkWalletRequest:
      type: object
      required: [namespace, network, accountId, publicKey, signature]
      properties:
        namespace: { type: string, enum: [near] }
        network: { type: string, enum: [local, testnet, mainnet] }
        accountId: { type: string }
        publicKey: { type: string }
        signature: { type: string, description: 'signature proving control of the account key' }
    FundingAttemptRequest:
      type: object
      required: [eventId, participantAccount, destinationAsset, expectedAtomic]
      properties:
        eventId: { type: string, format: uuid }
        participantAccount: { type: string }
        destinationAsset: { type: string }
        expectedAtomic: { $ref: '#/components/schemas/Money' }
        sourceChain: { type: string }
        sourceAsset: { type: string }
    QuoteRequest:
      type: object
      required: [provider]
      properties:
        provider: { type: string }
    CheckinRequestRequest:
      type: object
      properties:
        qrChallengeId: { type: string, format: uuid }
        manualReason:
          type: string
          description: required when qrChallengeId is absent
      oneOf:
        - required: [qrChallengeId]
        - required: [manualReason]
    DraftRequest:
      type: object
      required: [title, rules]
      properties:
        title: { type: string }
        description: { type: string }
        venue: { type: string }
        venueTimezone: { type: string }
        rules:
          type: object
          required: [depositAtomic, capacity, times]
          properties:
            depositAtomic: { $ref: '#/components/schemas/Money' }
            capacity: { type: integer, minimum: 1, maximum: 200 }
            assetContract: { type: string }
            times:
              type: object
              required: [regOpen, regClose, cancelCutoff, checkinOpen, checkinClose]
              properties:
                regOpen: { type: string, format: date-time }
                regClose: { type: string, format: date-time }
                cancelCutoff: { type: string, format: date-time }
                checkinOpen: { type: string, format: date-time }
                checkinClose: { type: string, format: date-time }
    PublishIntentRequest:
      type: object
      required: [draftId, organizerAccount, network, contractId]
      properties:
        draftId: { type: string, format: uuid }
        organizerAccount: { type: string, description: 'immutable organizer NEAR account; must match the NEAR binding' }
        network: { type: string, enum: [local, testnet, mainnet] }
        contractId: { type: string }
        contentHash: { type: string, description: 'hash of the immutable publish rules/content version' }
    PrivyAuthRequest:
      type: object
      required: [jwt, network]
      properties:
        jwt: { type: string, description: 'server-verified Privy JWT (issuer/audience/expiry checked server-side; never trusted from the browser)' }
        network: { type: string, enum: [local, testnet, mainnet] }
        nearAccount: { type: string, description: 'optional proof of NEAR account control; REQUIRED before participant actions' }

    MeEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, required: [userId, sessionId, active, accountId, network], properties: { userId: { type: string, format: uuid }, sessionId: { type: string, format: uuid }, active: { type: boolean }, accountId: { type: string, nullable: true }, network: { type: string, nullable: true } } } } } ] }
    LogoutEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, required: [loggedOut, revoked], properties: { loggedOut: { type: boolean }, revoked: { type: boolean } } } } } ] }
    # ---- response envelopes -------------------------------------------------
    EventEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/Event' } } } ] }
    EventListEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items: { type: array, items: { $ref: '#/components/schemas/Event' } }
                nextCursor: { type: string, nullable: true }
    ChallengeEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, required: [challengeId, nonce, domain, network, accountId, expiresAt], properties: { challengeId: { type: string, format: uuid }, nonce: { type: string }, domain: { type: string }, network: { type: string }, accountId: { type: string }, expiresAt: { type: string, format: date-time } } } } } ] }
    SessionEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, properties: { userId: { type: string, format: uuid }, expiresAt: { type: string, format: date-time } } } } } ] }
    LinkEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, properties: { linked: { type: boolean } } } } } ] }
    WalletBindingEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, properties: { namespace: { type: string }, network: { type: string }, accountId: { type: string } } } } } ] }
    PassListEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Pass' } } } } } } ] }
    QrEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [id, nonce, eventId, passId, ownerAccount, issuedAt, expiresAt, keyId]
              properties:
                id: { type: string, format: uuid }
                nonce: { type: string }
                eventId: { type: string, format: uuid }
                passId: { type: string, format: uuid }
                ownerAccount: { type: string }
                issuedAt: { type: string, format: date-time }
                expiresAt: { type: string, format: date-time }
                keyId: { type: string }
    FundingAttemptEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/FundingAttempt' } } } ] }
    QuoteEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, required: [provider, expiresAt, expectedOutputAtomic, minimumOutputAtomic], properties: { provider: { type: string }, expiresAt: { type: string, format: date-time }, expectedOutputAtomic: { $ref: '#/components/schemas/Money' }, minimumOutputAtomic: { $ref: '#/components/schemas/Money' } } } } } ] }
    CheckinRequestEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, properties: { id: { type: string, format: uuid }, state: { type: string, enum: [PROPOSED, SUBMITTED, CONFIRMED, FAILED, EXPIRED] } } } } } ] }
    RosterEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      participantAccount:
                        type: string
                      attendanceStatus:
                        type: boolean
                      payoutState:
                        $ref: '#/components/schemas/PayoutState'
                      finalized:
                        type: boolean
                      network:
                        type: string
                      contractId:
                        type: string
                      chainEventId:
                        type: string
                      chainRegistrationId:
                        type: string
                        nullable: true
                      chainPassId:
                        type: string
                        nullable: true
                      registrationId:
                        type: string
                        format: uuid
                      registrationStatus:
                        type: string
                      observedAt:
                        type: string
                        format: date-time
                    required:
                      - registrationId
                      - participantAccount
                      - attendanceStatus
                      - payoutState
                      - observedAt
                      - finalized
                      - network
                      - contractId
                      - chainEventId
                      - chainRegistrationId
                      - chainPassId
    ResultsEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [eventId, chainEventId, state, counts, totals, finalized, refund, settlement, yield, observedAt]
              properties:
                eventId: { type: string, format: uuid }
                chainEventId: { type: string }
                state: { $ref: '#/components/schemas/EventState' }
                counts:
                  type: object
                  required: [registrations, activeRegistrations, withdrawn, attendees, noShows]
                  properties:
                    registrations: { type: integer, minimum: 0 }
                    activeRegistrations: { type: integer, minimum: 0 }
                    withdrawn: { type: integer, minimum: 0 }
                    attendees: { type: integer, minimum: 0 }
                    noShows: { type: integer, minimum: 0 }
                totals:
                  type: object
                  required: [acceptedAtomic, paidAtomic, pendingAtomic, liabilityAtomic, realizedYieldAtomic, allocatedYieldAtomic, unallocatedYieldAtomic]
                  properties:
                    acceptedAtomic: { $ref: '#/components/schemas/Money' }
                    realizedYieldAtomic: { $ref: '#/components/schemas/Money' }
                    allocatedYieldAtomic: { $ref: '#/components/schemas/Money' }
                    unallocatedYieldAtomic: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Held yield not allocated to participant claims' }
                    paidAtomic: { $ref: '#/components/schemas/Money' }
                    pendingAtomic: { $ref: '#/components/schemas/Money' }
                    liabilityAtomic: { $ref: '#/components/schemas/Money' }
                finalized: { type: boolean }
                refund:
                  type: object
                  required: [available, reason, principalAtomic]
                  properties:
                    available: { type: boolean }
                    reason: { type: string, enum: [CANCELLED, TIMEOUT], nullable: true }
                    principalAtomic: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
                settlement:
                  type: object
                  required: [available, claimsEnabled, complete]
                  properties:
                    available: { type: boolean }
                    claimsEnabled: { type: boolean }
                    complete: { type: boolean }
                yield:
                  type: object
                  required: [status, reason]
                  properties:
                    status: { type: string, enum: [UNAVAILABLE] }
                    reason: { type: string, enum: [ABI_NOT_FROZEN] }
                observedAt: { type: string, format: date-time }
    ClaimListEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      principalAtomic:
                        $ref: '#/components/schemas/Money'
                      bonusAtomic:
                        $ref: '#/components/schemas/Money'
                      payoutState:
                        $ref: '#/components/schemas/PayoutState'
                      finalized:
                        type: boolean
                      network:
                        type: string
                      contractId:
                        type: string
                      chainEventId:
                        type: string
                      chainRegistrationId:
                        type: string
                        nullable: true
                      chainPassId:
                        type: string
                        nullable: true
                      id:
                        type: string
                        format: uuid
                      eventId:
                        type: string
                        format: uuid
                      beneficiaryAccount:
                        type: string
                      claimAtomic:
                        $ref: '#/components/schemas/Money'
                      observedAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - eventId
                      - beneficiaryAccount
                      - principalAtomic
                      - bonusAtomic
                      - claimAtomic
                      - payoutState
                      - finalized
                      - observedAt
                      - network
                      - contractId
                      - chainEventId
                      - chainRegistrationId
                      - chainPassId
    ContentEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, properties: { items: { type: array, items: { type: object, required: [id, title], properties: { id: { type: string, pattern: '^[a-f0-9]{64}$' }, title: { type: string }, mimeType: { type: string }, publishedAt: { type: string, format: date-time, nullable: true } } } } } } } } ] }
    DraftEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, required: [id, revision], properties: { id: { type: string, format: uuid }, revision: { type: integer } } } } } ] }
    PublishIntentEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, required: [intentId, targetContract, method, argsHash, expiresAt], properties: { intentId: { type: string, format: uuid }, targetContract: { type: string }, method: { type: string, enum: [create_event] }, argsHash: { type: string }, expiresAt: { type: string, format: date-time } } } } } ] }
    PrivyAuthEnvelope: { allOf: [ { $ref: '#/components/schemas/BaseEnvelope' }, { type: object, properties: { data: { type: object, required: [userId, nearBindingPresent], properties: { userId: { type: string, format: uuid }, nearBindingPresent: { type: boolean, description: 'false => participant actions are unavailable until a NEAR binding is proved' } } } } } ] }
