[package]
name = "showstake-product-runner"
description = "LOCAL product integration runner: real ShowStake Wasm + FT fixture on a temporary NEAR Sandbox"
version = "0.1.0"
edition = "2024"
resolver = "3"

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
borsh = { version = "=1.8.1", features = ["derive"] }
near-api = "=0.8.7"
near-sandbox = "=0.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
tokio = { version = "=1.48.0", features = ["full"] }
