name: showstake-testnet
networks:
  default:
    ipam:
      config:
        - subnet: ${SHOWSTAKE_DOCKER_SUBNET:?verified unique subnet required}
services:
  postgres:
    image: ${SHOWSTAKE_POSTGRES_IMAGE:?digest required}
    container_name: showstake-testnet-postgres18
    restart: unless-stopped
    env_file: /etc/showstake-testnet/postgres.env
    environment:
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:55442:5432"
    volumes:
      - /var/lib/showstake-testnet/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
